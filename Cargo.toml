[workspace]
resolver = "3"
members = ["crates/sim-cli","crates/sim-core", "crates/sim-protocol", "crates/sim-server", "crates/sim-store"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
glam = {  version = "0.33.2", features = ["serde"] }
hifitime = "4.3.0"
rusqlite = {  version = "0.40.1", feautres = ["bundled"] }
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.103"
thiserror = "2.0.18"